name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check models exist
        run: |
          python -c "
          import os
          models = ['models/xgb_best_model.pkl', 'models/ordinal_encoder.pkl', 'models/shap_explainer.pkl']
          for m in models:
              assert os.path.exists(m), f'Missing: {m}'
              print(f'✅ {m} exists')
          "

      - name: Check data files exist
        run: |
          python -c "
          import os
          files = ['data/master_dataset.csv', 'data/layoffs_cleaned.csv', 'data/ticker_mapping.csv']
          for f in files:
              assert os.path.exists(f), f'Missing: {f}'
              print(f'✅ {f} exists')
          "

      - name: Test model loads correctly
        run: |
          python -c "
          import pickle
          with open('models/xgb_best_model.pkl', 'rb') as f:
              model = pickle.load(f)
          print('✅ Model loaded successfully')

          with open('models/ordinal_encoder.pkl', 'rb') as f:
              encoder = pickle.load(f)
          print('✅ Encoder loaded successfully')

          with open('models/shap_explainer.pkl', 'rb') as f:
              explainer = pickle.load(f)
          print('✅ SHAP explainer loaded successfully')
          "

      - name: Test prediction runs
        run: |
          python -c "
          import pickle
          import pandas as pd
          import numpy as np

          with open('models/xgb_best_model.pkl', 'rb') as f:
              model = pickle.load(f)
          with open('models/ordinal_encoder.pkl', 'rb') as f:
              encoder = pickle.load(f)

          test_data = pd.DataFrame([{
              'Industry': 'Hardware',
              'Stage': 'Post-IPO',
              'Country': 'United States',
              'Funds_Raised': 1200.0,
              'Cash_Reserves': 9e10,
              'Profit_Margin': 0.19,
              'Revenue_Growth': 0.045
          }])

          cat_cols = ['Industry', 'Stage', 'Country']
          test_data[cat_cols] = encoder.transform(test_data[cat_cols])

          score = float(model.predict_proba(test_data)[0][1])
          assert 0 <= score <= 1, 'Score out of range'
          print(f'✅ Prediction works — score: {score:.4f}')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build FastAPI Docker image
        run: docker build -f Dockerfile.api -t layoff-fastapi .

      - name: Build Streamlit Docker image
        run: docker build -f Dockerfile.streamlit -t layoff-streamlit .

      - name: Confirm both images built
        run: |
          echo "✅ FastAPI image built"
          echo "✅ Streamlit image built"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::072160582837:role/layoff-radar-github-deploy-role
          aws-region: us-east-2

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push FastAPI image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -f Dockerfile.api \
            -t $ECR_REGISTRY/layoff-radar-api:${{ github.sha }} \
            -t $ECR_REGISTRY/layoff-radar-api:latest .
          docker push $ECR_REGISTRY/layoff-radar-api:${{ github.sha }}
          docker push $ECR_REGISTRY/layoff-radar-api:latest

      - name: Register new task definition revision
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          aws ecs describe-task-definition --task-definition layoff-radar-api --region us-east-2 --query 'taskDefinition' | \
            jq --arg IMAGE "$ECR_REGISTRY/layoff-radar-api:${{ github.sha }}" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) | .containerDefinitions[0].image = $IMAGE | .runtimePlatform = {"cpuArchitecture":"X86_64","operatingSystemFamily":"LINUX"}' \
            > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json --region us-east-2

      - name: Deploy to ECS and wait for it to stabilize
        run: |
          aws ecs update-service \
            --cluster layoff-radar-cluster \
            --service layoff-radar-service \
            --task-definition layoff-radar-api \
            --force-new-deployment \
            --region us-east-2
          aws ecs wait services-stable \
            --cluster layoff-radar-cluster \
            --services layoff-radar-service \
            --region us-east-2

      - name: Trigger Streamlit deploy on Render
        run: |
          curl "${{ secrets.RENDER_STREAMLIT_DEPLOY_HOOK }}"
          echo "✅ Streamlit deploy triggered"